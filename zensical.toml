[project]
site_name = "Thomas Saigre-Tardif, PhD"
site_author = "Thomas Saigre"
site_url = "https://thomas-saigre.github.io"
site_description = "My personal page :)"
copyright = "Copyright &copy; 2026 Thomas Saigre"
# repo_url = "https://github.com/thomas-saigre/thomas-saigre.github.io"
# repo_name = "thomas-saigre/thomas-saigre.github.io"


nav = [
    { "Home" = "index.md" },
    { "Research" = "research.md" },
    { "Diffusion" = "talks.md" },
    { "Teaching" = "teaching.md" },
    { "Miscellaneous" = "miscellaneous.md" },
    { "CV" = "cv.pdf" },
]

extra_css = ["css/extra.css"]
extra_javascript = ["javascripts/last-updated.js"]

[project.theme]
variant = "classic"
custom_dir = "overrides"
logo = "assets/nœnœuil.png"
favicon = "assets/nœnœuil.png"
font.text = "Inria Sans"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.instant",
    "navigation.top",
    "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.minify]
minify_html = true
minify_js = true
minify_css = true

[project.markdown_extensions.attr_list]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/thomas-saigre"

[[project.extra.social]]
icon = "fontawesome/brands/orcid"
link = "https://orcid.org/0009-0009-5763-4956"

[[project.extra.social]]
icon = "fontawesome/brands/google-scholar"
link = "https://scholar.google.fr/citations?user=eXz9qmcAAAAJ&hl=fr&oi=ao"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/thomas-saigre-tardif-09722a1b7/"